<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI App</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>AI Assistant</h1>
      <p class="sub">Ask anything. Add <code>OPENAI_API_KEY</code> for live model responses.</p>

      <section id="chat" class="chat"></section>

      <form id="composer" class="composer">
        <input id="prompt" type="text" placeholder="Ask for ideas, summaries, plans..." required />
        <button type="submit">Send</button>
      </form>
    </main>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("composer");
      const input = document.getElementById("prompt");
      const messages = [];

      function addBubble(role, content) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = content;
        chat.appendChild(bubble);
        chat.scrollTop = chat.scrollHeight;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = input.value.trim();
        if (!content) return;

        messages.push({ role: "user", content });
        addBubble("user", content);
        input.value = "";

        const loading = document.createElement("div");
        loading.className = "bubble assistant loading";
        loading.textContent = "Thinking...";
        chat.appendChild(loading);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });
          const data = await response.json();
          loading.remove();
          messages.push({ role: "assistant", content: data.reply });
          addBubble("assistant", data.reply);
        } catch {
          loading.textContent = "Sorry, something went wrong.";
          loading.classList.remove("loading");
        }
      });

      addBubble("assistant", "Hi! Tell me what you want to build today.");
    </script>
  </body>
</html>
