<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldWide Chat</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
      #messages { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; }
      .msg { margin-bottom: 10px; }
      .system { color: #666; font-style: italic; }
      .meta { font-size: 12px; color: #888; }
      form, .top { display: flex; gap: 8px; margin-top: 12px; }
      input, button { padding: 10px; }
      input { flex: 1; }
    </style>
  </head>
  <body>
    <h1>🌍 WorldWide Chat</h1>
    <p>Anyone with this link can join and chat in real-time from anywhere.</p>

    <div class="top">
      <input id="username" placeholder="Your name" />
      <button id="connectBtn">Connect</button>
    </div>

    <div id="messages"></div>

    <form id="chatForm">
      <input id="message" placeholder="Type message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <script>
      let socket = null;
      const messages = document.getElementById('messages');
      const messageInput = document.getElementById('message');

      function addMessage(text, klass = 'msg') {
        const div = document.createElement('div');
        div.className = `msg ${klass}`;
        div.innerHTML = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      document.getElementById('connectBtn').addEventListener('click', () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          addMessage('Already connected', 'system');
          return;
        }

        const username = document.getElementById('username').value.trim() || 'Anonymous';
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(`${protocol}://${window.location.host}/ws?username=${encodeURIComponent(username)}`);

        socket.onopen = () => addMessage('Connected to global chat ✅', 'system');
        socket.onclose = () => addMessage('Disconnected ❌', 'system');
        socket.onerror = () => addMessage('Connection error', 'system');

        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'system') {
            addMessage(`${data.message} <span class="meta">(${new Date(data.sentAt).toLocaleString()})</span>`, 'system');
          } else {
            addMessage(`<strong>${data.username}</strong>: ${data.message} <span class="meta">(${new Date(data.sentAt).toLocaleString()})</span>`);
          }
        };
      });

      document.getElementById('chatForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          addMessage('Connect first before sending messages.', 'system');
          return;
        }
        const message = messageInput.value.trim();
        if (!message) return;
        socket.send(JSON.stringify({ message }));
        messageInput.value = '';
      });
    </script>
  </body>
</html>
